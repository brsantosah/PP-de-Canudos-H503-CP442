<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validação Material</title>

<!-- 💡 CÓDIGO EMBUTIDO DO LEITOR DE QR CODE (NÃO DEPENDE MAIS DA INTERNET/CDN) -->
<script>

<!-- 💡 CÓDIGO EMBUTIDO DO BANCO DE DADOS SUPABASE (COMPACTADO E INTEGRADO LOCALMENTE) -->
<script src="https://unpkg.com"></script>

<style>
body {
  text-align:center;
  font-family:Arial, sans-serif;
  background:white;
  margin: 0;
  padding: 20px;
}

#step { font-size:26px; font-weight:bold; margin-bottom: 10px;}
#result { font-size:32px; margin-top:20px; font-weight:bold; }

button {
  padding:15px;
  font-size:20px;
  margin-top:10px;
  border-radius:10px;
  cursor: pointer;
}

#btnLimpar {
  background-color: #ff9800;
  color: white;
  border: none;
}
</style>
</head>

<body>

<h2>Validação de Material</h2>

<div id="step">📷 Escaneie QR do SILO</div>

<div id="reader" style="width:320px;margin:auto;"></div>

<!-- Botões de ação iniciam explicitamente escondidos -->
<button id="btnBag" onclick="lerBag()" style="display:none;">📦 Escanear QR do BAG</button>
<button id="btnLimpar" onclick="novaLeitura()" style="display:none;">❌ Limpar Silo Errado</button>
<button id="btnNova" onclick="novaLeitura()" style="display:none;">🔄 Nova Leitura (Resetar)</button>

<div id="result"></div>

<script>
// --- CONFIGURAÇÃO DO BANCO DE DADOS ---
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0dGlmbnZpZnp6a3pzdHFyaG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODgyMzUsImV4cCI6MjA5NTU2NDIzNX0.d57PT0x8LilvTQPSclq0Wc7bKA1WBFl3rlUblCczrII";
let supabaseClient = null;

// Só ativa se a biblioteca responder corretamente
if (typeof supabase !== 'undefined') {
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

// Função para registrar na tabela
async function salvarNoHistorico(textoParaSalvar) {
  if (!supabaseClient) {
    console.error('Banco de dados offline. Registro local:', textoParaSalvar);
    return;
  }
  const { data, error } = await supabaseClient
    .from('Histórico H503 e CP442')
    .insert([{ Dados: textoParaSalvar }]);

  if (error) console.error('Erro Supabase:', error);
  else console.log('Histórico gravado na nuvem!');
}

// --- CONTROLE DO SCANNER E ÁUDIO ---
let okSound = new Audio("ok.mp3");
let errorSound = new Audio("erro.mp3");
let audioLiberado = false;

document.body.addEventListener("click", () => {
  if(!audioLiberado){
    okSound.play().then(()=>okSound.pause()).catch(()=>{});
    errorSound.play().then(()=>errorSound.pause()).catch(()=>{});
    audioLiberado = true;
  }
},{once:true});

const materiais = ["H503","CP442"];
let scanner = null;
let cameraId = null;
let siloCode = null;
let modo = "SILO"; 
let bloqueioLeitura = false; 

function extrairMaterial(texto){
  if (!texto) return null;
  texto = texto.toUpperCase().replace(/\s/g,"").replace(/-/g,"");
  if(texto.includes("H503")) return "H503";
  if(texto.includes("CP442")) return "CP442";
  return null;
}

async function iniciarScanner(){
  if (typeof Html5Qrcode === 'undefined') {
    console.error("Aguardando carregamento do leitor...");
    setTimeout(iniciarScanner, 1000);
    return;
  }
  try {
    await pararScanner();
    document.getElementById("reader").innerHTML = "";
    scanner = new Html5Qrcode("reader");

    let devices = await Html5Qrcode.getCameras();
    if(devices.length === 0) return;
    
    cameraId = devices[devices.length-1].id;
    await scanner.start(cameraId, { fps:10, qrbox:200 }, onScan);
  } catch (err) {
    console.error("Erro ao iniciar o scanner:", err);
  }
}

async function pararScanner(){
  if(scanner){
    try{ if(scanner.isScanning) await scanner.stop(); } catch(e){}
    scanner.clear();
    scanner = null;
  }
}

async function onScan(text){
  if(bloqueioLeitura) return; 
  let material = extrairMaterial(text);
  if(!material) return; 

  if(modo === "SILO"){
    bloqueioLeitura = true; 
    await pararScanner();
    siloCode = material;
    modo = "ESPERANDO_BAG";

    document.getElementById("result").innerHTML = "Silo: <b>"+material+"</b>";
    document.getElementById("step").innerHTML = "Clique para escanear o BAG";
    
    document.getElementById("btnBag").style.display="inline-block";
    document.getElementById("btnLimpar").style.display="inline-block";
  } 
  else if(modo === "BAG"){
    bloqueioLeitura = true; 
    await pararScanner();
    validar(material);
  }
}

async function lerBag(){
  modo = "BAG";
  bloqueioLeitura = false; 
  document.getElementById("step").innerHTML = "📦 Escaneie QR do BAG";
  document.getElementById("btnBag").style.display="none";
  document.getElementById("btnLimpar").style.display="none"; 
  await iniciarScanner();
}

function validar(bagMaterial){
  let resumoParaSalvar = "";

  if(bagMaterial === siloCode){
    document.body.style.backgroundColor="green";
    document.getElementById("result").innerHTML = "✅ OK<br>Material: " + bagMaterial;
    resumoParaSalvar = "Sucesso - Silo: " + siloCode + " | Bag: " + bagMaterial;
    if(audioLiberado) okSound.play().catch(()=>{});
  } else {
    document.body.style.backgroundColor="red";
    document.getElementById("result").innerHTML = "❌ ERRO<br>Silo: "+siloCode+"<br>Bag: "+bagMaterial;
    resumoParaSalvar = "ALERTA ERRO - Silo: " + siloCode + " | Bag: " + bagMaterial;
    if(audioLiberado) {
      errorSound.play().catch(()=>{});
      setTimeout(()=> errorSound.play().catch(()=>{}), 400);
    }
  }

  salvarNoHistorico(resumoParaSalvar);
  document.getElementById("step").innerHTML = "Validação Concluída";
  document.getElementById("btnNova").style.display="inline-block";
}

async function novaLeitura(){
  await pararScanner();
  modo = "SILO";
  siloCode = null;
  bloqueioLeitura = false; 
  document.body.style.backgroundColor="white";
  document.getElementById("step").innerHTML = "📷 Escaneie QR do SILO";
  document.getElementById("result").innerHTML = "";
  document.getElementById("btnBag").style.display="none";
  document.getElementById("btnLimpar").style.display="none";
  document.getElementById("btnNova").style.display="none";
  setTimeout(iniciarScanner, 300);
}

// Inicialização garantida
iniciarScanner();
</script>
</body>
</html>
