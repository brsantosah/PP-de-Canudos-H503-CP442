<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validação Material</title>

<!-- Biblioteca do Leitor de QR Code -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- 1. CORREÇÃO: Link oficial correto para carregar o Supabase -->
<script src="https://jsdelivr.net"></script>

<style>
body {
  text-align:center;
  font-family:Arial, sans-serif;
  background:white;
  margin: 0;
  padding: 20px;
}

#step { font-size:26px; font-weight:bold; margin-bottom: 10px;}
#result { font-size:32px; margin-top:20px; font-weight:bold; }

button {
  padding:15px;
  font-size:20px;
  margin-top:10px;
  border-radius:10px;
  cursor: pointer;
}

/* Estilo específico para o botão de limpar ficar destacado */
#btnLimpar {
  background-color: #ff9800;
  color: white;
  border: none;
}
</style>
</head>

<body>

<h2>Validação de Material</h2>

<div id="step">📷 Escaneie QR do SILO</div>

<div id="reader" style="width:320px;margin:auto;"></div>

<!-- Botão para avançar para o BAG -->
<button id="btnBag" onclick="lerBag()" style="display:none;">
📦 Escanear QR do BAG
</button>

<!-- 🆕 Botão Limpar Silo Errado -->
<button id="btnLimpar" onclick="novaLeitura()" style="display:none;">
❌ Limpar Silo Errado
</button>

<!-- Botão de Nova Leitura pós-validação -->
<button id="btnNova" onclick="novaLeitura()" style="display:none;">
🔄 Nova Leitura (Resetar)
</button>

<div id="result"></div>

<script>
// 🔊 Sons
let okSound = new Audio("ok.mp3");
let errorSound = new Audio("erro.mp3");

// 🔓 Liberar áudio pelo clique do usuário
let audioLiberado = false;
document.body.addEventListener("click", () => {
  if(!audioLiberado){
    okSound.play().then(()=>okSound.pause()).catch(()=>{});
    errorSound.play().then(()=>errorSound.pause()).catch(()=>{});
    audioLiberado = true;
  }
},{once:true});

// Materiais válidos
const materiais = ["H503","CP442"];

// Controle de estado
let scanner = null;
let cameraId = null;
let siloCode = null;
let modo = "SILO"; // SILO ou BAG
let bloqueioLeitura = false; // 🆕 BARREIRA DE SEGURANÇA

// 2. CORREÇÃO: Ajustado para o endpoint correto da sua API do Supabase (lttifnvifzzkzstqrhmk)
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0dGlmbnZpZnp6a3pzdHFyaG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODgyMzUsImV4cCI6MjA5NTU2NDIzNX0.d57PT0x8LilvTQPSclq0Wc7bKA1WBFl3rlUblCczrII";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Função assíncrona para SALVAR as informações no histórico do Supabase
async function salvarNoHistorico(textoParaSalvar) {
  const { data, error } = await supabase
    .from('historico')
    .insert([{ dados: textoParaSalvar }]);

  if (error) {
    console.error('Erro ao salvar no Supabase:', error);
  } else {
    console.log('Validado e salvo no banco com sucesso!');
  }
}

// Função opcional para BUSCAR o histórico se necessário
async function carregarHistorico() {
  const { data, error } = await supabase
    .from('historico')
    .select('*');

  if (error) {
    console.error('Erro ao buscar:', error);
  } else {
    console.log('Histórico carregado:', data);
  }
}

// ✅ Extrair material válido do texto
function extrairMaterial(texto){
  if (!texto) return null;
  texto = texto.toUpperCase().replace(/\s/g,"").replace(/-/g,"");

  if(texto.includes("H503")) return "H503";
  if(texto.includes("CP442")) return "CP442";

  return null;
}

// ✅ Iniciar câmera de forma limpa
async function iniciarScanner(){
  try {
    await pararScanner();
    document.getElementById("reader").innerHTML = "";
    scanner = new Html5Qrcode("reader");

    let devices = await Html5Qrcode.getCameras();
    if(devices.length === 0) {
      alert("Nenhuma câmera encontrada.");
      return;
    }
    cameraId = devices[devices.length-1].id;

    await scanner.start(
      cameraId,
      { fps:10, qrbox:200 },
      onScan
    );
  } catch (err) {
    console.error("Erro ao iniciar o scanner:", err);
  }
}

// ✅ Parar câmera completamente
async function pararScanner(){
  if(scanner){
    try{
      if(scanner.isScanning){
        await scanner.stop();
      }
    } catch(e){
      console.error("Erro ao parar:", e);
    }
    scanner.clear();
    scanner = null;
  }
}

// ✅ Processamento da leitura (Centralizado)
async function onScan(text){
  if(bloqueioLeitura) return; // 🆕 Bloqueia leituras fantasmas durante transições

  let material = extrairMaterial(text);
  if(!material) return; 

  // Cenário 1: Leitura do SILO realizada com sucesso
  if(modo === "SILO"){
    bloqueioLeitura = true; // 🆕 Ativa a barreira imediatamente
    await pararScanner();
    siloCode = material;
    modo = "ESPERANDO_BAG";

    document.getElementById("result").innerHTML = "Silo: <b>"+material+"</b>";
    document.getElementById("step").innerHTML = "Clique para escanear o BAG";
    
    // Exibe o botão do BAG e o novo botão de Limpar/Corrigir Silo
    document.getElementById("btnBag").style.display="inline-block";
    document.getElementById("btnLimpar").style.display="inline-block";
  } 
  // Cenário 2: Leitura do BAG
  else if(modo === "BAG"){
    bloqueioLeitura = true; // 🆕 Ativa a barreira para não ler duas vezes seguidas
    await pararScanner();
    validar(material);
  }
}

// ✅ Transição para ler o BAG
async function lerBag(){
  modo = "BAG";
  bloqueioLeitura = false; // 🆕 Libera a barreira pois o usuário clicou intencionalmente
  document.getElementById("step").innerHTML = "📦 Escaneie QR do BAG";
  document.getElementById("btnBag").style.display="none";
  document.getElementById("btnLimpar").style.display="none"; // Oculta o limpar pois já travou o processo
  
  await iniciarScanner();
}

// ✅ Validação, disparo dos alarmes e salvamento automático
function validar(bagMaterial){
  let resumoParaSalvar = "";

  if(bagMaterial === siloCode){
    document.body.style.backgroundColor="green";
    document.getElementById("result").innerHTML = "✅ OK<br>Material: " + bagMaterial;

    // Monta o texto que vai para a nuvem
    resumoParaSalvar = "Sucesso - Silo: " + siloCode + " | Bag: " + bagMaterial;

    if(audioLiberado){
      okSound.currentTime = 0;
      okSound.play().catch(e => console.log(e));
    }
  } else {
    document.body.style.backgroundColor="red";
    document.getElementById("result").innerHTML = "❌ ERRO<br>Silo: "+siloCode+"<br>Bag: "+bagMaterial;

    // Monta o texto de falha que vai para a nuvem
    resumoParaSalvar = "ALERTA ERRO - Silo: " + siloCode + " | Bag: " + bagMaterial;

    if(audioLiberado){
      errorSound.currentTime = 0;
      errorSound.play().catch(e => console.log(e));
      setTimeout(()=>{
        errorSound.currentTime = 0;
        errorSound.play().catch(e => console.log(e));
      }, 400);
    }

    if(navigator.vibrate) {
      navigator.vibrate([300, 200, 300]);
    }
  }

  // DISPARO AUTOMÁTICO PARA O BANCO DE DADOS
  salvarNoHistorico(resumoParaSalvar);

  document.getElementById("step").innerHTML = "Validação Concluída";
  document.getElementById("btnNova").style.display="inline-block";
}

// 🔄 Reset Total do App (Trata o botão Nova Leitura e o botão Limpar)
async function novaLeitura(){
  okSound.pause();
  errorSound.pause();
  okSound.currentTime = 0;
  errorSound.currentTime = 0;

  await pararScanner();

  modo = "SILO";
  siloCode = null;
  bloqueioLeitura = false; // 🆕 Reseta a barreira para a nova leitura do Silo

  document.body.style.backgroundColor="white";
  document.getElementById("step").innerHTML = "📷 Escaneie QR do SILO";
  document.getElementById("result").innerHTML = "";

  // Garante que TODOS os botões de ação fiquem escondidos no reinício
  document.getElementById("btnBag").style.display="none";
  document.getElementById("btnLimpar").style.display="none";
  document.getElementById("btnNova").style.display="none";

  setTimeout(()=>{
    iniciarScanner();
  }, 300);
}

// Inicializa a aplicação na abertura do app
iniciarScanner();
</script>

</body>
</html>
